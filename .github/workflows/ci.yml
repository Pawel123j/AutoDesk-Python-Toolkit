name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend — ruff i testy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalacja zależności
        # Wersja ruffa przypięta: domyślny zestaw reguł zmienia się między
        # wydaniami i bez tego CI potrafi zapalić się na czerwono przy
        # niezmienionym kodzie.
        run: |
          pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Testy
        # Zastąpiło `python -m compileall backend/app`. Sprawdzanie, czy kod
        # daje się sparsować, nie mówi nic o tym, czy robi to, co powinien —
        # a to jest aplikacja do przetwarzania danych, gdzie błąd nie wywala
        # niczego, tylko zwraca złe liczby.
        run: pytest

  frontend:
    name: Frontend — ESLint, typy, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalacja zależności
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Kontrola typów
        run: npm run typecheck

      - name: Audyt zależności
        run: npm run security:check

      - name: Build
        run: npm run build

  docker:
    name: Obrazy Dockera
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build obrazu backendu
        run: docker build -f backend/Dockerfile -t toolkit-backend:ci .

      - name: Build obrazu frontendu
        run: docker build -f frontend/Dockerfile -t toolkit-frontend:ci .

      - name: Sprawdź, czy backend odpowiada
        # Obraz, którego nikt nie uruchomił, nie jest dowodem na nic.
        run: |
          docker run -d --name toolkit-check -p 8000:8000 toolkit-backend:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/ > response.json; then
              cat response.json
              docker rm -f toolkit-check
              exit 0
            fi
            sleep 2
          done
          echo "::error::Backend nie odpowiedział w ciągu 60 s"
          docker logs toolkit-check
          docker rm -f toolkit-check
          exit 1
