name: Full stack browser regression
on: [push, pull_request]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://127.0.0.1:18320
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r e2e/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-logs
          path: e2e/artifacts
