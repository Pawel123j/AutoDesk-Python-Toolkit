# Uruchomienie całości jedną komendą:  docker compose up --build
#
# Backend na http://localhost:8000 (dokumentacja API pod /docs),
# frontend na http://localhost:5173.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Frontend w kontenerze odpytuje backend z przeglądarki użytkownika,
      # czyli spod adresu localhost:5173 — stąd ten wpis w CORS.
      CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
    volumes:
      # Baza SQLite i pliki generowane przeżywają restart kontenera.
      - toolkit-data:/app/generated
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/', timeout=2).status == 200 else 1)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  toolkit-data:
